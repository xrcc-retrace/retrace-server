name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # cairosvg (icon renderer) links against libcairo at import time.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 ffmpeg
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        env:
          GEMINI_API_KEY: ci-dummy
        run: python -m pytest -q tests
      - name: Import smoke (app boots without a real key)
        env:
          GEMINI_API_KEY: ci-dummy
        run: python -c "import main, routers.expert_interview, services.troubleshoot.handlers; print('imports ok')"
